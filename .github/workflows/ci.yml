# Continuous integration for morpheum-cli.
#
# This repository had no CI, and the cost of that was not hypothetical:
# it was found broken — see the fixes that accompanied this workflow.
# The gates below are the ones that would have caught it.
#
# ## Why the sibling checkouts
#
# morpheum-cli reaches its dependencies through `../` path entries, so cargo
# needs them on disk as siblings. Every job therefore checks this repo
# out under its own name and its dependencies alongside, reproducing the
# local layout. This applies to `cargo fmt` too: `--all` resolves the
# package graph, so it fails just like the rest without them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes the older run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: morpheum-cli
    steps:
      - uses: actions/checkout@v4
        with:
          path: morpheum-cli
      - name: Verify access to private siblings
        # Fail here, naming the repository, rather than midway through a
        # checkout whose 404 does not say whether the repo is missing or
        # the token simply cannot see it.
        env:
          CI_REPO_READ_TOKEN: ${{ secrets.CI_REPO_READ_TOKEN }}
        run: |
          if [ -z "$CI_REPO_READ_TOKEN" ]; then
            echo "::error::CI_REPO_READ_TOKEN is unset. morpheum-cli depends on private repositories (morpheum-primitives morpheum-proto cryptogram contracts) through ../ paths and cannot build without them. Note that secrets are not provided to workflows triggered from forks, so this is expected on fork pull requests."
            exit 1
          fi
          failed=""
          for repo in morpheum-primitives morpheum-proto cryptogram contracts; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
                     -H "Authorization: Bearer $CI_REPO_READ_TOKEN" \
                     "https://api.github.com/repos/morpheum-labs/$repo")
            echo "  $repo: HTTP $code"
            [ "$code" = "200" ] || failed="$failed $repo"
          done
          if [ -n "$failed" ]; then
            echo "::error::CI_REPO_READ_TOKEN cannot read:$failed. Grant it read-only Contents access to each, and authorise SSO if the organisation requires it."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: morpheum-labs/morpheum-primitives
          path: morpheum-primitives
          token: ${{ secrets.CI_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: morpheum-labs/morpheum-proto
          path: morpheum-proto
          token: ${{ secrets.CI_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: morpheum-labs/cryptogram
          path: cryptogram
          token: ${{ secrets.CI_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: morpheum-labs/morpheum-signing
          path: morpheum-signing
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: morpheum-labs/morpheum-sdk
          path: morpheum-sdk
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: morpheum-labs/contracts
          path: contracts
          token: ${{ secrets.CI_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install protoc
        # `morpheum-proto` generates its bindings with prost-build, which
        # shells out to protoc. The runner image does not ship it, so
        # without this every cargo invocation fails in a build script.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          protoc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: morpheum-cli -> target
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        # -D warnings is the point of the gate: this repository accumulated
        # warnings precisely because nothing failed on them.
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-features
